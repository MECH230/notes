project:
  type: book


title: "MECH230 Dynamics Notes"
number-sections: true

engine: knitr

knitr:
  opts_chunk:
    echo: false


book:
  sidebar:
    style: "docked"
    search: true
    collapse-level: 2 # This ensures ## sections are visible/expanded by default
  chapters:
    - index.qmd
    - part: "Preliminaries"
      chapters:
        - preliminaries/active_learning.qmd
        - preliminaries/note_on_units.qmd
        - preliminaries/free_body_diagrams.qmd
        - preliminaries/vector_calculus.qmd
        - preliminaries/fundamental_concepts_of_solid_mechanics.qmd
        - preliminaries/continuum_mechanics_perspective.qmd
    - part: "Particle Dynamics"
      chapters:
        - particle_dynamics/basic_particle_kinematics.qmd
        - particle_dynamics/particle_kinetics.qmd
        - particle_dynamics/cylindrical_polar_coordinates.qmd
        - particle_dynamics/constrained_motion.qmd
        - particle_dynamics/serret_frenet_triad.qmd
        - particle_dynamics/spring_force.qmd
        - particle_dynamics/friction_force.qmd
        - particle_dynamics/gravitational_force_model.qmd
        - particle_dynamics/power_work_energy.qmd
        - particle_dynamics/momenta_and_impulses.qmd
        - particle_dynamics/collisions.qmd
    - part: "System of Particles"
      chapters:
        - system_of_particles/system_of_particles.qmd
    - part: "Rigid Body Dynamics"
      chapters:
        - rigid_body_dynamics/rigid_body_kinematics.qmd
        - rigid_body_dynamics/rigid_body_kinetics.qmd
        - rigid_body_dynamics/work_energy_theorem.qmd
        - rigid_body_dynamics/systems_of_particles_and_rigid_bodies.qmd
    - part: "Lagrangian Mechanics"
      chapters:
        - lagrangian_mechanics/lagranges_equations.qmd
    - references.qmd
    - part: "Appendices"
      chapters:
        - appendices/conservative_forces.qmd
        - appendices/sets_linear_function_spaces.qmd

bibliography: references.bib


format:
  html:
    theme:
      - cosmo # Try: lumen, flatly, quartz, or materia
      - brand
    include-in-header:
      text: |
        <script>
        MathJax = {
          tex: {
            macros: {
              lnorm: "\\left|\\!\\left|",
              rnorm: "\\right|\\!\\right|",
              lp: "\\left(",
              rp: "\\right)",
              leb: "\\left[",
              reb: "\\right]",
              bomega: "\\boldsymbol{\\omega}",
              bOmega: "\\boldsymbol{\\Omega}",
              balpha: "\\boldsymbol{\\alpha}",
              bchi: "\\boldsymbol{\\chi}",
              bpi: "\\boldsymbol{\\pi}",
              bPi: "\\boldsymbol{\\Pi}",
              hdots: "\\ldots"
            }
          }
        };
        </script>
        <style>
        /* Historical Perspective boxes: same visual pattern as the built-in
           Quarto callouts (colored title bar + tinted body) but in a
           distinct purple/violet so they are never confused with the
           Think!/Note/Example callouts used elsewhere. */
        .historical-box {
          border: 1px solid #6a1b9a;
          border-radius: 0.25rem;
          margin: 1.5rem 0;
          padding: 0.75rem 1.25rem 1rem 1.25rem;
          background-color: #faf5fc;
        }
        .historical-box.historical-collapsed {
          padding-bottom: 0;
        }
        .historical-title {
          display: block;
          margin: -0.75rem -1.25rem 0.75rem -1.25rem;
          padding: 0.5rem 1.25rem;
          background-color: #6a1b9a;
          color: #ffffff;
          font-weight: 600;
          border-radius: calc(0.25rem - 1px) calc(0.25rem - 1px) 0 0;
          cursor: pointer;
          user-select: none;
          position: relative;
          padding-right: 2.5rem;
        }
        .historical-box.historical-collapsed .historical-title {
          margin-bottom: 0;
        }
        .historical-box > p:has(> .historical-title) {
          margin: 0;
        }
        .historical-title::after {
          content: "\25BE";
          position: absolute;
          right: 1.25rem;
          top: 0.5rem;
          font-size: 1.1em;
          transition: transform 0.2s ease;
        }
        .historical-box.historical-collapsed .historical-title::after {
          transform: rotate(-90deg);
        }
        .historical-content {
          overflow: hidden;
        }
        .historical-box.historical-collapsed .historical-content {
          display: none;
        }
        .historical-box figure {
          text-align: center;
        }
        .historical-box figcaption {
          font-size: 0.85em;
          color: #555555;
        }
        </style>
        <script>
        document.addEventListener("DOMContentLoaded", function () {
          document.querySelectorAll(".historical-box").forEach(function (box) {
            var title = box.querySelector(".historical-title");
            if (!title) return;

            // Pandoc wraps a bare [text]{.class} span in its own <p>. Walk up
            // to that paragraph (if any) so the whole header line toggles and
            // so we collect *its* siblings, not the span's (which has none).
            var titleBlock = title.closest("p") || title;

            // Gather everything after the title block into a collapsible wrapper.
            var contentWrap = document.createElement("div");
            contentWrap.className = "historical-content";
            var node = titleBlock.nextSibling;
            while (node) {
              var next = node.nextSibling;
              contentWrap.appendChild(node);
              node = next;
            }
            box.appendChild(contentWrap);

            // Start collapsed.
            box.classList.add("historical-collapsed");
            titleBlock.classList.add("historical-title-block");
            titleBlock.setAttribute("role", "button");
            titleBlock.setAttribute("tabindex", "0");
            titleBlock.setAttribute("aria-expanded", "false");

            function toggle() {
              var collapsed = box.classList.toggle("historical-collapsed");
              titleBlock.setAttribute("aria-expanded", String(!collapsed));
            }

            titleBlock.addEventListener("click", toggle);
            titleBlock.addEventListener("keydown", function (e) {
              if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                toggle();
              }
            });
          });
        });
        </script>
  pdf:
    documentclass: scrreprt
    include-in-header:
      text: |
        \usepackage{tikz}
        \DeclareOldFontCommand{\bf}{\normalfont\bfseries}{\mathbf}
        \newcommand{\lnorm}{\left|\!\left|}
        \newcommand{\rnorm}{\right|\!\right|}
        \newcommand{\lp}{\left(}
        \newcommand{\rp}{\right)}
        \newcommand{\leb}{\left[}
        \newcommand{\reb}{\right]}
        \newcommand{\bomega}{\boldsymbol{\omega}}
        \newcommand{\bOmega}{\boldsymbol{\Omega}}
        \newcommand{\balpha}{\boldsymbol{\alpha}}
        \newcommand{\bchi}{\boldsymbol{\chi}}
        \newcommand{\bpi}{\boldsymbol{\pi}}
        \newcommand{\bPi}{\boldsymbol{\Pi}}
        \providecommand{\hdots}{\ldots}


